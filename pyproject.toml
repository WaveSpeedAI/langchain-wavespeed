[build-system]
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[project]
name = "langchain-wavespeed"
version = "0.1.2"
description = "An integration package connecting WaveSpeed AI and LangChain"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "WaveSpeedAI", email = "support@wavespeed.ai" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=0.3.75,<2.0.0",
    "wavespeed>=1.0.12",
    "pydantic>=2.0.0,<3.0.0",
]

[project.urls]
Homepage = "https://wavespeed.ai"
Repository = "https://github.com/WaveSpeedAI/langchain-wavespeed"
Issues = "https://github.com/WaveSpeedAI/langchain-wavespeed/issues"
Documentation = "https://github.com/WaveSpeedAI/langchain-wavespeed#readme"

[dependency-groups]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "langchain-tests>=0.3.0",
]
lint = ["ruff>=0.9.0"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_wavespeed"]
# Ship the PEP 561 marker so downstream type checkers see the annotations.
artifacts = ["langchain_wavespeed/py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "compile: mark placeholder test used to compile integration tests",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
